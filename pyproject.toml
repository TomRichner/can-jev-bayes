[project]
name = "can-jev-bayes"
version = "0.1.0"
description = "Research environment for comparing Jev with Bayesian sequential decision methods"
authors = [{ name = "Thomas J Richner" }]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28,<1",
    "matplotlib>=3.10,<4",
    "numpy>=2.2,<3",
    "pandas>=2.2,<4",
    "pydantic>=2.10,<3",
    "python-dotenv>=1.0,<2",
    "scipy>=1.15,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
